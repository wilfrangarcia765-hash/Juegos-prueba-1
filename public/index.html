<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceff4">
<meta name="description" content="Tres en raya online: juega con un amigo desde otro dispositivo con un código de 4 letras.">
<title>Tres en raya online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff4; --surface:#ffffff; --ink:#1b2030; --muted:#667085; --line:#d3d8e3;
  --x:#2f4bdb; --o:#d98a00; --btn:#1b2030; --btnInk:#ffffff; --danger:#b42318;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13151c; --surface:#1d212c; --ink:#eef0f6; --muted:#9aa3b5; --line:#2e3444;
    --x:#7b93ff; --o:#f5b83d; --btn:#eef0f6; --btnInk:#13151c; --danger:#ff8a80;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:2.3rem;line-height:1.05;margin:12px 0 8px;font-weight:800;letter-spacing:-.02em}
p.sub{margin:0 0 28px;color:var(--muted);font-size:1.05rem;line-height:1.45}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-size:1.15rem;font-weight:700}
.panel p{margin:0 0 14px;color:var(--muted);font-size:.95rem;line-height:1.4}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:15px 18px;border-radius:14px;border:0;background:var(--btn);color:var(--btnInk);font-weight:700;font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.cell:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--x);outline-offset:2px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:800;font-size:1.3rem;letter-spacing:.35em;text-align:center;text-transform:uppercase}
.row .btn{width:auto;padding:14px 22px}
.msg{min-height:1.4em;margin:10px 2px 0;color:var(--danger);font-size:.95rem}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:.95rem}
.chip b{letter-spacing:.2em;font-size:1.05rem}
.link{background:none;border:0;color:var(--muted);font-weight:600;padding:9px 6px}
.status{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:4px 0;min-height:2.3em}
.hint{color:var(--muted);margin:0 0 16px;font-size:.95rem;min-height:1.3em}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:2px solid transparent}
.pl.turn{border-color:currentColor}
.pl.px{color:var(--x)} .pl.po{color:var(--o)}
.pl svg{width:30px;height:30px;flex:none;overflow:visible}
.pl svg *{fill:none;stroke:currentColor;stroke-width:11;stroke-linecap:round}
.pl .who{color:var(--ink);font-weight:600;font-size:.95rem;line-height:1.1}
.pl .who small{display:block;color:var(--muted);font-weight:500}
.pl .n{margin-left:auto;color:var(--ink);font-size:1.6rem;font-weight:800}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;aspect-ratio:1/1;margin-bottom:18px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cell:not(:disabled):hover{background:var(--bg)}
.cell:disabled{cursor:default}
.cell svg{width:68%;height:68%;overflow:visible}
.cell svg *{fill:none;stroke-width:11;stroke-linecap:round}
.cell .mx{stroke:var(--x)} .cell .mo{stroke:var(--o)}
.cell.new svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s ease-out forwards}
.cell.new svg *:nth-child(2){animation-delay:.18s}
@keyframes draw{to{stroke-dashoffset:0}}
.cell.win{border-width:2.5px}
.cell.win.wx{border-color:var(--x)} .cell.win.wo{border-color:var(--o)}
.cell.dim svg{opacity:.35}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnInk);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:5}
@media (prefers-reduced-motion: reduce){.cell.new svg *{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
  <section id="lobby">
    <h1>Tres en raya online</h1>
    <p class="sub">Dos dispositivos, una partida. Uno crea el código y el otro lo escribe.</p>
    <div class="panel">
      <h2>Crear partida</h2>
      <p>Recibirás un código de 4 letras y un enlace para pasárselo a tu rival.</p>
      <button class="btn" id="btnCreate">Crear partida</button>
    </div>
    <div class="panel">
      <h2>Unirme con un código</h2>
      <p>Escribe el código que te ha dado tu rival.</p>
      <div class="row">
        <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Código de partida">
        <button class="btn" id="btnJoin">Unirme</button>
      </div>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section id="game" class="hidden">
    <div class="top">
      <button class="chip" id="btnShare" title="Compartir enlace">Código <b id="codeTxt">----</b></button>
      <button class="link" id="btnLeave">Salir</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <p class="hint" id="hint"></p>
    <div class="score" id="score"></div>
    <div class="board" id="board" role="grid" aria-label="Tablero"></div>
    <button class="btn hidden" id="btnAgain">Jugar otra ronda</button>
  </section>
</main>
<div class="toast hidden" id="toast"></div>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

  var me = lsGet('ttt_pid');
  if(!me || !/^[a-z0-9]{6,40}$/.test(me)){
    me = (Math.random().toString(36).slice(2,10)+Date.now().toString(36)).slice(0,24);
    lsSet('ttt_pid',me);
  }
  var game=null, code=null, es=null, prevBoard=null, busy=false;

  function msg(t){ $('#msg').textContent=t||''; }
  var tt; function toast(t){ var el=$('#toast'); el.textContent=t; el.classList.remove('hidden'); clearTimeout(tt); tt=setTimeout(function(){el.classList.add('hidden')},2200); }

  function xSvg(cls){ return '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="'+cls+'" pathLength="1" d="M24 24 L76 76"/><path class="'+cls+'" pathLength="1" d="M76 24 L24 76"/></svg>'; }
  function oSvg(cls){ return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="'+cls+'" pathLength="1" cx="50" cy="50" r="28"/></svg>'; }

  async function post(path, body){
    body = body || {}; body.pid = me;
    var r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j = {}; try{ j = await r.json(); }catch(e){}
    if(!r.ok) throw { status:r.status, error:j.error };
    return j;
  }

  function connect(c){
    if(es) es.close();
    code=c; lsSet('ttt_code',c); prevBoard=null; game=null;
    $('#codeTxt').textContent=c;
    $('#lobby').classList.add('hidden'); $('#game').classList.remove('hidden');
    history.replaceState(null,'','?c='+c);
    es = new EventSource('/api/events?code='+c+'&pid='+me);
    es.onmessage = function(e){ game = JSON.parse(e.data); render(); };
    es.onerror = function(){
      if(es.readyState===2){ leave('La partida ya no existe o ha caducado.'); }
    };
  }

  function leave(note){
    if(es){ es.close(); es=null; }
    game=null; code=null; lsDel('ttt_code');
    history.replaceState(null,'','./');
    $('#game').classList.add('hidden'); $('#lobby').classList.remove('hidden');
    msg(note||'');
  }

  function render(){
    var g=game, sym=g.you, over=!!g.winner, ready=g.hasO;
    var st, hint='';
    if(!sym){ st='Partida llena'; hint='Ya hay dos jugadores. Estás viendo la partida.'; }
    else if(!ready){ st='Esperando a tu rival'; hint='Pulsa el código de arriba para compartir el enlace.'; }
    else if(g.winner==='D'){ st='Empate'; hint='Nadie ha ganado esta ronda.'; }
    else if(over){ st=g.winner===sym?'Has ganado':'Ha ganado tu rival'; hint='Ronda '+g.round+' terminada.'; }
    else if(g.turn===sym){ st='Tu turno'; hint='Juegas con '+sym+'.'; }
    else { st='Turno de tu rival'; hint='Juegas con '+sym+'.'; }
    $('#status').textContent=st; $('#hint').textContent=hint;

    var turnSym=(!over&&ready)?g.turn:'';
    function pl(s,n){
      var mine=sym===s, here = s==='X' ? true : g.hasO;
      return '<div class="pl p'+s.toLowerCase()+(turnSym===s?' turn':'')+'">'+
        (s==='X'?xSvg('mx'):oSvg('mo'))+
        '<span class="who">'+(mine?'Tú':(sym?'Rival':'Jugador '+s))+'<small>'+(here?'conectado':'esperando')+'</small></span>'+
        '<span class="n">'+n+'</span></div>';
    }
    $('#score').innerHTML=pl('X',g.sx)+pl('O',g.so);

    var win=g.line?g.line.split('').map(Number):[], html='';
    for(var i=0;i<9;i++){
      var c=g.board[i], isNew=prevBoard!==null&&prevBoard[i]==='.'&&c!=='.';
      var cls='cell'+(isNew?' new':'');
      if(win.indexOf(i)>-1) cls+=' win w'+g.winner.toLowerCase(); else if(win.length) cls+=' dim';
      var can=!over&&ready&&g.turn===sym&&c==='.';
      html+='<button class="'+cls+'" data-i="'+i+'" role="gridcell" aria-label="Casilla '+(i+1)+(c==='.'?', vacía':', '+c)+'"'+(can?'':' disabled')+'>'+
        (c==='X'?xSvg('mx'):c==='O'?oSvg('mo'):'')+'</button>';
    }
    $('#board').innerHTML=html; prevBoard=g.board;
    $('#btnAgain').classList.toggle('hidden',!(over&&sym));
  }

  $('#board').addEventListener('click',async function(e){
    var b=e.target.closest('.cell'); if(!b||busy) return;
    busy=true;
    try{ await post('/api/move',{code:code,i:+b.getAttribute('data-i')}); }
    catch(err){ if(err.error!=='illegal') toast('No se pudo enviar tu jugada'); }
    busy=false;
  });
  $('#btnAgain').addEventListener('click',async function(){
    try{ await post('/api/again',{code:code}); }catch(e){ toast('No se pudo empezar otra ronda'); }
  });
  $('#btnLeave').addEventListener('click',function(){ leave(''); });
  $('#btnShare').addEventListener('click',async function(){
    var url=location.origin+'/?c='+code;
    try{
      if(navigator.share){ await navigator.share({title:'Tres en raya',text:'Juega conmigo al tres en raya. Código: '+code,url:url}); return; }
      await navigator.clipboard.writeText(url); toast('Enlace copiado');
    }catch(e){ toast('Código: '+code); }
  });
  $('#codeIn').addEventListener('input',function(e){ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
  $('#codeIn').addEventListener('keydown',function(e){ if(e.key==='Enter') $('#btnJoin').click(); });

  async function join(c){
    msg('');
    try{ await post('/api/join',{code:c}); connect(c); return true; }
    catch(err){
      msg(err.error==='not_found'?'No existe ninguna partida con ese código.':err.error==='full'?'Esa partida ya tiene dos jugadores.':'No se pudo conectar. Inténtalo de nuevo.');
      return false;
    }
  }
  $('#btnCreate').addEventListener('click',async function(){
    var b=this; b.disabled=true; msg('');
    try{ var r=await post('/api/create'); connect(r.code); }
    catch(e){ msg('No se pudo crear la partida. Inténtalo de nuevo.'); }
    b.disabled=false;
  });
  $('#btnJoin').addEventListener('click',async function(){
    var c=$('#codeIn').value.trim();
    if(c.length<4){ msg('El código tiene 4 caracteres.'); return; }
    var b=this; b.disabled=true; await join(c); b.disabled=false;
  });

  (async function init(){
    var q=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
    var saved=lsGet('ttt_code');
    if(/^[A-Z0-9]{4}$/.test(q)
